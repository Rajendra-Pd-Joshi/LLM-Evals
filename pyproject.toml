[project]
name = "llm-evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rajendra Prasad Joshi", email = "rajendraprasadjoshi22@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.0",
    "google-genai>=2.31.0",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.11",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "portalocker[win32]>=4.4.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llm-evals = "llm_evals:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
